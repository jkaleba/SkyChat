name: iOS prototype

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test signing configuration logic
        run: python3 -B -m unittest discover -s tools/ios/tests -v
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - name: Test native contact protocol on iOS Simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -sdk iphonesimulator -destination "id=$DEVICE_ID" \
            -resultBundlePath build/ios-prototype.xcresult CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES
      - name: Save native test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-prototype-tests
          path: build/ios-prototype.xcresult
          if-no-files-found: ignore
          retention-days: 7
