name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed build to App Store Connect for TestFlight
        type: boolean
        default: false
      build_number:
        description: Optional unique numeric build number (normally leave empty)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-testflight
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test signing configuration logic
        run: python3 -B -m unittest discover -s tools/ios/tests -v
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Check signing configuration
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: python3 tools/ios/ci_signing.py install
      - run: flutter pub get
      - name: Build signed iPhone IPA
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER="${REQUESTED_BUILD_NUMBER:-$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))}"
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "Build number must be a positive integer with at most 9 digits."
            exit 1
          fi
          flutter build ipa --release --build-number "$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/skychat-ios-signing/ExportOptions.plist"
      - name: Save signed IPA
        uses: actions/upload-artifact@v7
        with:
          name: skychat-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 tools/ios/ci_signing.py upload
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: python3 tools/ios/ci_signing.py cleanup
